<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plate Coach</title>
<meta name="description" content="Evidence-based gym coach: weekly split, guided sessions, progress tracking.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plate Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: phone-first single column coach with a fixed bottom tab bar; competition-plate colors code muscle regions (red push, blue pull, yellow legs, green core). */
:root{
  --bg:#EEF0F3;--surface:#FFFFFF;--surface2:#E4E7EC;--ink:#14171C;--muted:#5A6170;--line:#D3D7DE;
  --red:#C3342A;--blue:#2453BF;--yellow:#B98A00;--green:#26804E;--on:#FFFFFF;
  --redsoft:#F7E1DF;--bluesoft:#DFE6F7;--yellowsoft:#F5ECCF;--greensoft:#DCEFE3;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317;--surface:#1A1D23;--surface2:#242831;--ink:#ECEEF2;--muted:#9BA2AE;--line:#2D323B;
  --red:#E85A4E;--blue:#6C96F2;--yellow:#E8BD3F;--green:#4DB87D;--on:#111317;
  --redsoft:#3A1F1D;--bluesoft:#1E2840;--yellowsoft:#3A3118;--greensoft:#1A3326;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317;--surface:#1A1D23;--surface2:#242831;--ink:#ECEEF2;--muted:#9BA2AE;--line:#2D323B;
  --red:#E85A4E;--blue:#6C96F2;--yellow:#E8BD3F;--green:#4DB87D;--on:#111317;
  --redsoft:#3A1F1D;--bluesoft:#1E2840;--yellowsoft:#3A3118;--greensoft:#1A3326;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on);font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 18px}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;border:1px solid transparent}
.m-red{background:var(--redsoft);color:var(--red)}.m-blue{background:var(--bluesoft);color:var(--blue)}
.m-yellow{background:var(--yellowsoft);color:var(--yellow)}.m-green{background:var(--greensoft);color:var(--green)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border-left:3px solid var(--yellow);background:var(--yellowsoft);padding:10px 12px;border-radius:6px;font-size:13px}
.warn{border-left-color:var(--red);background:var(--redsoft)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-height:76px}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase}
.day .dt{font-size:11px;line-height:1.2;color:var(--muted)}
.day.rest{background:transparent;border-style:dashed}
.day.today{border-color:var(--ink);border-width:2px}
.day.done{background:var(--greensoft)}
.day button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tick{color:var(--green);font-weight:700;font-size:13px}
/* blocks */
.block{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.block:first-child{border-top:0;padding-top:0}
.bhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.blabel{font-family:var(--f-display);font-weight:700;font-size:22px;width:24px}
.exrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:start}
.tag{font-family:var(--f-display);font-weight:700;font-size:15px;border-radius:6px;background:var(--surface2);text-align:center;padding:2px 0}
.exname{font-weight:600}
.rx{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* runner */
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--red)}
.current{border:2px solid var(--ink)}
.bigname{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;text-transform:uppercase}
.target{font-family:var(--f-display);font-size:22px;font-weight:600}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface2);font-size:22px;font-weight:600}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700;width:100%;min-width:0;padding:6px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.setchips{display:flex;flex-wrap:wrap;gap:6px}
.setchip{font-family:var(--f-display);font-size:16px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface2);font-variant-numeric:tabular-nums}
.check{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%}
.check:hover{border-color:var(--line)}
.check.on{background:var(--surface2)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.f{background:var(--green);border-color:var(--green)}
.done-name{text-decoration:line-through;color:var(--muted)}
/* volume */
.vol{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:13px}
.track{position:relative;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:var(--greensoft);border-left:1px dashed var(--green);border-right:1px dashed var(--green)}
.fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:2px}
.f-red{background:var(--red)}.f-blue{background:var(--blue)}.f-yellow{background:var(--yellow)}.f-green{background:var(--green)}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{border:0;background:none;padding:12px 2px 10px;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:3px solid transparent}
#tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:var(--f-display);font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);border-width:2px}
.sci{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.sci .k{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--red);line-height:1}
.ref{font-size:12px;color:var(--muted)}
.hist summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;z-index:60;font-size:14px}
.loading{padding:40px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.progress>i{transition:width .3s}}
@media (max-width:420px){h1{font-size:30px}.bigname{font-size:28px}.vol{grid-template-columns:78px minmax(0,1fr) 34px}}

.exlink{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-decoration-thickness:2px}
.exlink:hover{text-decoration-color:var(--red)}
.exlink:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.exlink.exname{font-weight:600}
.chip.outline{border-color:var(--line);color:var(--muted)}
.howto summary{cursor:pointer;font-weight:600;color:var(--blue);font-size:14px}
.howto ol{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.big{font-size:36px;font-weight:700}
.day.sel{outline:2px solid var(--red);outline-offset:1px}
.axis{position:relative;height:14px;font-size:12px}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none;left:0}
textarea,input.plain{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input.plain{font-family:var(--f-display);font-size:24px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.inputs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
a.btn{text-decoration:none;color:var(--ink);text-align:center}
label.btn{cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<main id="app"><div class="loading muted">Loading your training…</div></main>
<nav id="tabs" aria-label="Sections"><div class="in">
  <button data-a="tab" data-v="today">Today</button>
  <button data-a="tab" data-v="week">Week</button>
  <button data-a="tab" data-v="history">History</button>
  <button data-a="tab" data-v="science">Science</button>
  <button data-a="tab" data-v="settings">Setup</button>
</div></nav>
<div id="rest" class="overlay" hidden></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Exercise library. p=primary muscles, s=secondary, eq=bb|db|mc|bw, c=compound, inc=load step class,
   t=tags (k=knee stress, b=low-back stress, s=shoulder stress, x=loaded stretch, w=power), u='s' for time-based,
   st=steps, mi=common mistakes. */
const MUS={chest:['Chest','red'],delts:['Shoulders','red'],triceps:['Triceps','red'],back:['Back','blue'],rear:['Rear delts','blue'],biceps:['Biceps','blue'],
  quads:['Quads','yellow'],hams:['Hamstrings','yellow'],glutes:['Glutes','yellow'],calves:['Calves','yellow'],core:['Core','green'],cond:['Conditioning','green']};
const EX={
 squat_bb:{n:'Barbell Back Squat',p:['quads'],s:['glutes','core'],eq:'bb',c:1,inc:'L',t:'kb',
  st:['Set the bar on your upper back, hands just outside shoulders, step back two short steps.','Feet shoulder width, toes slightly out. Big breath into your belly and brace.','Sit down between your hips, knees tracking over your toes, until thighs are at least parallel.','Drive the floor away, keeping chest and hips rising together. Exhale at the top.'],
  mi:['Knees caving in on the way up','Hips shooting up first so it turns into a good morning','Losing the brace and rounding at the bottom']},
 legpress:{n:'Leg Press',p:['quads'],s:['glutes'],eq:'mc',c:1,inc:'ML',t:'',
  st:['Sit with your back and hips flat against the pad, feet mid-platform, shoulder width.','Release the safeties and lower the sled under control.','Go as deep as you can without your lower back lifting off the pad.','Press through the whole foot. Stop just short of locking the knees.'],
  mi:['Hips curling off the seat at the bottom','Locking knees hard at the top','Cutting depth to move more weight']},
 squat_goblet:{n:'Goblet Squat',p:['quads'],s:['glutes','core'],eq:'db',c:1,inc:'D',t:'',
  st:['Hold one dumbbell vertically against your chest, elbows pointing down.','Feet a bit wider than shoulders, toes out.','Squat down so your elbows end up inside your knees, torso tall.','Stand up by pushing knees out and driving through mid-foot.'],
  mi:['Letting the dumbbell drift away from the chest','Heels lifting off the floor']},
 split_db:{n:'Bulgarian Split Squat',p:['quads'],s:['glutes'],eq:'db',c:1,inc:'D',t:'kx',
  st:['Stand about a stride in front of a bench, place the top of your rear foot on it.','Hold dumbbells at your sides, most weight on the front foot.','Lower the back knee straight down until the front thigh is about parallel.','Push through the front heel to stand. Finish all reps, then switch legs.'],
  mi:['Front foot too close, so the knee shoots far forward','Pushing off the back foot instead of the front leg']},
 rdl_bb:{n:'Romanian Deadlift',p:['hams'],s:['glutes','back'],eq:'bb',c:1,inc:'L',t:'bx',
  st:['Stand holding the bar at hip height, hands just outside thighs.','Unlock the knees slightly and keep them there.','Push your hips back, sliding the bar down your thighs, back flat.','Stop when you feel a strong hamstring stretch (usually mid-shin), then drive hips forward to stand.'],
  mi:['Bending the knees more as you go down, turning it into a squat','Bar drifting away from the legs','Rounding the lower back to reach lower']},
 rdl_db:{n:'Dumbbell Romanian Deadlift',p:['hams'],s:['glutes'],eq:'db',c:1,inc:'D',t:'x',
  st:['Hold dumbbells in front of your thighs, soft knees.','Hinge at the hips, dumbbells close to your legs.','Lower until you feel the hamstring stretch with a flat back.','Squeeze glutes and stand tall.'],
  mi:['Turning it into a squat','Looking up and craning the neck']},
 hipthrust:{n:'Barbell Hip Thrust',p:['glutes'],s:['hams'],eq:'bb',c:1,inc:'L',t:'',
  st:['Sit with your upper back against a bench, bar padded over your hip crease.','Feet flat, about hip width, shins vertical at the top.','Tuck your chin and drive through your heels until hips are fully extended.','Pause one second squeezing your glutes, lower under control.'],
  mi:['Arching the lower back instead of extending the hips','Feet too far forward, shifting work to hamstrings']},
 bridge_db:{n:'Dumbbell Glute Bridge',p:['glutes'],s:['hams'],eq:'db',c:0,inc:'D',t:'',
  st:['Lie on your back, knees bent, dumbbell resting on your hips.','Drive through your heels and lift your hips.','Pause at the top with glutes squeezed, then lower.'],
  mi:['Pushing through the toes','Overarching the lower back at the top']},
 back_ext:{n:'45° Back Extension',p:['glutes'],s:['hams','back'],eq:'mc',c:0,inc:'M',t:'b',
  st:['Set the pad just below your hip crease, feet locked in.','Round slightly down, then lift by squeezing glutes until your body is in a straight line.','Hold a plate to your chest when bodyweight gets easy.'],
  mi:['Hyperextending past straight at the top','Swinging up with momentum']},
 legext:{n:'Leg Extension',p:['quads'],eq:'mc',c:0,inc:'M',t:'',
  st:['Line your knee up with the machine pivot, pad on your lower shin.','Hold the handles and keep your hips down.','Extend fully and squeeze for one second.','Lower slowly, about two seconds.'],
  mi:['Kicking the weight up','Hips lifting off the seat']},
 legcurl:{n:'Seated Leg Curl',p:['hams'],eq:'mc',c:0,inc:'M',t:'x',
  st:['Knee lined up with the pivot, pad just above your heels, thigh pad snug.','Lean your torso slightly forward for a bigger hamstring stretch.','Curl as far as you can, squeeze, then return slowly to full stretch.'],
  mi:['Cutting the range short at the top or bottom','Letting the weight stack slam']},
 slider_curl:{n:'Slider Leg Curl',p:['hams'],s:['glutes'],eq:'bw',c:0,inc:'B',t:'',
  st:['Lie on your back with heels on sliders or a towel on a smooth floor.','Lift your hips into a bridge.','Slide heels away until legs are nearly straight, then curl them back under you, hips staying up.'],
  mi:['Hips dropping as legs extend']},
 calf_machine:{n:'Standing Calf Raise',p:['calves'],eq:'mc',c:0,inc:'ML',t:'x',
  st:['Shoulders under the pads, balls of the feet on the edge.','Lower your heels as far as possible and pause two seconds in the stretch.','Rise as high as you can onto your big toes, pause, repeat.'],
  mi:['Bouncing out of the bottom','Short half reps']},
 calf_db:{n:'Single-leg Calf Raise',p:['calves'],eq:'db',c:0,inc:'D',t:'x',
  st:['Stand on a step on one foot, dumbbell in the same-side hand, other hand on a wall.','Lower the heel to a deep stretch and pause.','Rise all the way up, pause, repeat. Then switch sides.'],
  mi:['Bouncing','Bending the knee to cheat']},
 bench_bb:{n:'Barbell Bench Press',p:['chest'],s:['delts','triceps'],eq:'bb',c:1,inc:'U',t:'s',
  st:['Eyes under the bar, feet planted, squeeze shoulder blades together and down.','Grip slightly wider than shoulders, unrack with straight arms.','Lower to your lower chest with elbows about 45° from your body.','Press up and slightly back toward your face. Exhale at the top.'],
  mi:['Elbows flared to 90°','Bouncing the bar off the chest','Shoulders rolling forward at the top']},
 bench_db:{n:'Dumbbell Bench Press',p:['chest'],s:['delts','triceps'],eq:'db',c:1,inc:'D',t:'x',
  st:['Sit with dumbbells on your thighs, kick them up as you lie back.','Shoulder blades back, dumbbells over your chest.','Lower until you feel a deep chest stretch, elbows about 45°.','Press up and slightly together.'],
  mi:['Stopping short of the stretch','Dropping dumbbells sideways at the end of a set']},
 incline_db:{n:'Incline Dumbbell Press',p:['chest'],s:['delts','triceps'],eq:'db',c:1,inc:'D',t:'x',
  st:['Set the bench at about 30°.','Press dumbbells up over your upper chest, shoulder blades pinned.','Lower to a stretch beside the upper chest, then press up.'],
  mi:['Bench too steep, turning it into a shoulder press']},
 chest_press:{n:'Machine Chest Press',p:['chest'],s:['triceps','delts'],eq:'mc',c:1,inc:'M',t:'',
  st:['Seat height so handles line up with mid-chest.','Back flat on the pad, shoulder blades back.','Press out without locking hard, return slowly to a full stretch.'],
  mi:['Seat too low or high','Shoulders shrugging forward']},
 pushup:{n:'Push-up',p:['chest'],s:['triceps','core'],eq:'bw',c:1,inc:'B',t:'',
  st:['Hands slightly wider than shoulders, body straight from head to heels.','Lower until your chest nearly touches the floor, elbows about 45°.','Push the floor away and lock out. Elevate hands to make it easier.'],
  mi:['Hips sagging','Only moving the head down']},
 ohp_bb:{n:'Overhead Press',p:['delts'],s:['triceps','core'],eq:'bb',c:1,inc:'U',t:'sb',

/* ---------- Exercise selection ---------- */
const eqOk=id=>S.profile.equip==='full'||EX[id].eq==='db'||EX[id].eq==='bw';
const limHits=id=>(S.profile.limits||[]).filter(l=>EX[id].t.includes(l)).length;
function score(id){
  const e=EX[id],g=S.profile.goal,q=e.eq;let s=0;
  if(g==='str')s+=(q==='bb'?3:q==='db'||q==='bw'?1:0)+(e.c?2:0);
  if(g==='hyp')s+=(q==='mc'?2:q==='bw'?0:1)+(e.t.includes('x')?1:0);
  if(g==='fat')s+=(q==='db'||q==='bw'?1:0)+(e.c?1:0);
  if(g==='ath')s+=(q==='bb'?2:q==='db'?1:0)+(e.c?1:0)+(e.t.includes('w')?2:0);
  if(g==='gen')s+=(q==='db'?2:q==='mc'||q==='bw'?1:0);
  return s;
}
function ranked(pat){
  const base=PAT[pat].filter(eqOk);
  let ok=base.filter(id=>!limHits(id));if(!ok.length)ok=[...base].sort((a,b)=>limHits(a)-limHits(b)).slice(0,1);
  return ok.map((id,i)=>[id,score(id)-i*.01]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function selectable(id){return eqOk(id)&&!limHits(id)}
function blockSpecs(tpl){
  const P=S.profile,T=TPL[tpl],specs=T.g.map((g,gi)=>({id:String(gi),pats:g,kind:'main'})),present=new Set(T.g.flat());
  if(P.goal==='ath')specs.unshift({id:'pw',pats:['power'],kind:'power'});
  (P.focus||[]).forEach(f=>{const F=FOCUS[f];if(F.r!=='any'&&T.r!=='b'&&F.r!==T.r)return;if(F.pats.some(p=>present.has(p)))return;
    specs.push({id:'f'+f,pats:F.pats,kind:'focus',focus:f});F.pats.forEach(p=>present.add(p))});
  if(P.goal==='gen'&&!present.has('core'))specs.push({id:'core',pats:['core'],kind:'main'});
  if(P.goal==='fat')specs.push({id:'fin',pats:['cond'],kind:'finisher'});
  return specs;
}
function resolve(tpl,v,spec,si){
  const key=`${tpl}.${v}.${spec.id}.${si}`,o=S.profile.overrides[key];
  if(o&&EX[o]&&eqOk(o))return{key,ex:o};

}
function rx(id,kind){
  const e=EX[id],P=S.profile,c=e.c,G=P.goal;
  if(kind==='power')return{lo:3,hi:5,sets:3,rir:3,rest:120};
  if(kind==='finisher')return e.u==='s'?{lo:20,hi:20,sets:6,rir:0,rest:40}:{lo:10,hi:15,sets:5,rir:1,rest:45};
  const R=e.u==='s'?[30,60]:{str:c?[3,6]:[8,12],hyp:c?[6,10]:[10,15],fat:c?[8,12]:[12,15],ath:c?[4,6]:[8,12],gen:c?[8,12]:[12,15]}[G];
  let sets=c?{beg:3,int:3,adv:4}[P.level]:{beg:2,int:3,adv:3}[P.level];if(G==='fat')sets=Math.min(sets,3);

function pairInfo(a,b){
  const x=EX[a].p[0],y=EX[b].p[0];
  if(ANT.some(([m,n])=>(m===x&&n===y)||(m===y&&n===x)))
    return{type:'Antagonist superset',why:`${MUS[x][0]} and ${MUS[y][0]} work opposite joint actions, so one recovers while the other works. Same quality, roughly a third less time.`};
  const lx=LEGM.includes(x),ly=LEGM.includes(y);
  if(lx!==ly&&x!=='core'&&y!=='core')return{type:'Upper / lower pair',why:'Different body regions, no shared fatigue between the two.'};
  return{type:'Non-competing pair',why:`${MUS[x][0]} and ${MUS[y][0]} don't share a prime mover, so alternating costs little performance.`};
}

/* ---------- Plan ---------- */
function splitFor(n,w){
  if(n===3)return w%2===0?[['FB_A','A'],['FB_B','A'],['FB_A','B']]:[['FB_B','A'],['FB_A','A'],['FB_B','B']];
  return{2:[['FB_A','A'],['FB_B','A']],4:[['UPPER','A'],['LOWER','A'],['UPPER','B'],['LOWER','B']],
    5:[['UPPER','A'],['LOWER','A'],['PUSH','A'],['PULL','A'],['LEGS','A']],
    6:[['PUSH','A'],['PULL','A'],['LEGS','A'],['PUSH','B'],['PULL','B'],['LEGS','B']]}[n];
}
function weekPlan(w){
  const days=[...S.profile.days].sort((a,b)=>a-b),sp=splitFor(days.length,w),out=Array(7).fill(null);
  days.forEach((d,i)=>out[d]={tpl:sp[i][0],v:sp[i][1],slot:i,day:d});return out;
}
const dayName=p=>TPL[p.tpl].n+(p.v==='B'?' (B)':'');
const isDeload=w=>S.profile.deload&&((w%5)+5)%5===4;
function buildSession(w,slot){
  const p=weekPlan(w).find(x=>x&&x.slot===slot),dl=isDeload(w);let li=0;
  const blocks=blockSpecs(p.tpl).map(spec=>{
    const items=spec.pats.map((pat,si)=>{const{key,ex}=resolve(p.tpl,p.v,spec,si),r=rx(ex,spec.kind);
      return{key,pat,kind:spec.kind,ex,...r,sets:dl&&spec.kind!=='finisher'?Math.max(1,Math.ceil(r.sets/2)):r.sets,rir:dl?Math.max(3,r.rir):r.rir,logged:[],skipped:false}});
    const type=KINDLABEL[spec.kind]&&spec.kind!=='focus'?KINDLABEL[spec.kind]:items.length>1?pairInfo(items[0].ex,items[1].ex).type:'Straight sets';
    return{label:'ABCDEFGH'[li++],kind:spec.kind,focus:spec.focus,items,type};
  });
  return{id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,slot,tpl:p.tpl,v:p.v,day:p.day,name:dayName(p),deload:dl,blocks,startedAt:null};
}
const workSec=it=>EX[it.ex].u==='s'?it.lo:40;
function estMinutes(sess){
  let t=300;sess.blocks.forEach(b=>{const it=b.items,n=Math.max(...it.map(x=>x.sets)),r=Math.max(...it.map(x=>x.rest));
    t+=it.length>1?n*(workSec(it[0])+workSec(it[1])+45+r*.8):n*(workSec(it[0])+r);});return Math.round(t/60/5)*5;
}

function spark(pts){

  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${xy.map(p=>p.join(',')).join(' ')}"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="3" fill="var(--blue)"/></svg>`;
}

function viewScience(){
  const P=[
   ['2×','Train each muscle twice a week','With weekly volume matched, hitting a muscle at least twice per week produced more growth than once. Every split here gives each muscle two or more exposures.','Schoenfeld, Ogborn & Krieger, 2016, Sports Medicine (meta-analysis)'],
   ['10–20','Hard sets per muscle per week','Growth rises with weekly set volume, with diminishing returns at the top. The Week tab charts your sets against this range; focus areas add sets where you want them.','Schoenfeld, Ogborn & Krieger, 2017, J Sports Sciences (dose-response meta-analysis)'],
   ['↔','Pair antagonists','Alternating opposing muscles (chest/back, biceps/triceps, quads/hamstrings) keeps total load lifted while cutting session time. Pairs are built so the two moves never share a prime mover.','Robbins et al., 2010, J Strength Cond Res; Weakley et al., 2017, Eur J Appl Physiol'],
   ['2–3′','Rest long on compounds','Three-minute rests beat one-minute rests for both strength and size. Big lifts get 2–3 min unless your goal is fat loss, where shorter rests raise energy use.','Schoenfeld et al., 2016, J Strength Cond Res'],
   ['RIR','Stop 0–3 reps short of failure','Sets taken close to failure drive growth; going all the way adds fatigue for little extra. You log reps in reserve on every set.','Refalo et al., 2023, Sports Medicine (meta-analysis)'],
   ['6–30','Many rep ranges build muscle','Light and heavy loads grow muscle similarly when sets go near failure, but heavier loads build more strength. That is why each goal uses different rep ranges.','Schoenfeld et al., 2017, J Strength Cond Res'],
   ['↗','Stretch under load','Exercises that challenge the muscle at long lengths (RDLs, incline presses, overhead triceps work) tend to grow it more. The Build muscle goal favours them.','Pedrosa et al., 2022, Eur J Sport Sci; Maeo et al., 2023, Eur J Sport Sci'],
   ['+1','Double progression','Add reps inside the range, then add load once every set hits the top. Progressing reps or load gave similar gains; this method does both automatically.','Plotkin et al., 2022, PeerJ'],
   ['48 h','Space sessions for the same muscle','Muscle protein synthesis stays elevated for roughly a day or two after training. The Week tab flags back-to-back days that hit the same muscle.','MacDougall et al., 1995, Can J Appl Physiol'],
   ['W5','Deload every 5th week','Coaches commonly cut volume and intensity every 4–6 weeks to shed fatigue. This rests on practitioner consensus more than trials, so you can turn it off.','Bell et al., 2023, Sports Medicine – Open (Delphi consensus)']];
  return`<header class="stack"><h1>The science inside</h1><p class="muted">Each rule the coach follows, and where it comes from.</p></header>

    store.saveProfile();S.form=null;S.pick=null;S.tab='today';render();window.scrollTo(0,0);toast(first?'Program built. Here is your first session.':'Saved.');break}
  case'pick':S.pick={w:+t.dataset.w,slot:+t.dataset.slot};render();break;
  case'start':{const nx=nextPlanned(),p=S.pick||{w:nx.w,slot:nx.slot};S.active=buildSession(p.w,p.slot);S.active.startedAt=Date.now();S.pick=null;S.focus=null;S.draft=null;
    store.saveActive();keepAwake();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch{}render();window.scrollTo(0,0);break}
  case'bump':{const c=current(S.active),it=S.active.blocks[c.bi].items[c.ii],d=S.draft,dir=+t.dataset.d;
    if(t.dataset.f==='w'){const cur=parseFloat(d.w)||0;d.w=fmtN(Math.max(0,Math.round((cur+dir*incOf(it.ex))*100)/100))}else d.r=Math.max(0,(parseInt(d.r,10)||0)+dir*(EX[it.ex].u==='s'?5:1));render();break}
  case'rir':S.draft.rir=+v;render();break;
  case'log':logSet();break;
  case'undo':{let last=null;S.active.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>it.logged.forEach(s=>{if(!last||(s.t||0)>=(last.s.t||0))last={s,bi,ii}})));
    if(!last){toast('No sets logged yet');break}S.active.blocks[last.bi].items[last.ii].logged.pop();S.focus={bi:last.bi,ii:last.ii};S.draft=null;S.rest=null;renderRest();store.saveActive();render();toast('Last set removed');break}
  case'skipex':{const c=current(S.active);S.active.blocks[c.bi].items[c.ii].skipped=true;S.focus=null;S.draft=null;store.saveActive();render();break}
  case'focus':{S.focus={bi:+t.dataset.bi,ii:+t.dataset.ii};const it=S.active.blocks[S.focus.bi].items[S.focus.ii];if(it.skipped)it.skipped=false;S.draft=null;S.rest=null;renderRest();render();window.scrollTo(0,0);break}
  case'restadd':S.rest.until+=30000;S.rest.total+=30;break;
  case'restskip':S.rest=null;renderRest();break;
  case'askfinish':{const left=steps(S.active).filter(s=>pending(S.active,s)).length;if(!left){finishSession();break}
    S.confirm={title:'Finish early?',msg:`${left} set${left>1?'s are':' is'} not logged. Logged sets are saved; the rest are dropped.`,yes:'finish',label:'Finish'};render();break}
  case'finish':finishSession();break;
  case'askdiscard':S.confirm={title:'Discard this session?',msg:'Nothing from this session will be saved.',yes:'discard',label:'Discard'};render();break;
  case'discard':S.active=null;S.confirm=null;S.rest=null;renderRest();store.saveActive();render();break;
  case'closesummary':S.summary=null;render();window.scrollTo(0,0);break;
  case'info':S.info={ex:t.dataset.ex};render();$('#modal').scrollTop=0;break;
  case'quicklog':{const q=S.info.q,id=S.info.ex,w=parseFloat(q.w)||0,r=parseInt(q.r,10),n=Math.min(10,Math.max(1,parseInt(q.n,10)||1));
    if(!(r>0)){toast('Enter reps');break}if(!isBW(id)&&EX[id].u!=='s'&&!(w>0)){toast('Enter the load you used');break}
    const prs=quickLog(id,w,r,n);S.info.q=null;render();toast(prs.length?'Logged. New best!':`Logged ${n} set${n>1?'s':''}`);break}
  case'savenote':{const val=$('#ex-note').value.trim();if(val)S.profile.notes[S.info.ex]=val;else delete S.profile.notes[S.info.ex];store.saveProfile();toast('Note saved');break}
  case'swap':S.swap={key:t.dataset.key,pat:t.dataset.pat,live:!!t.dataset.live};if(S.swap.live){const c=current(S.active);S.swap.bi=c.bi;S.swap.ii=c.ii}render();break;
  case'doswap':case'resetswap':{const sw=S.swap;if(a==='doswap')S.profile.overrides[sw.key]=t.dataset.ex;else delete S.profile.overrides[sw.key];store.saveProfile();
    if(S.active){S.active.blocks.forEach(b=>b.items.forEach(it=>{if(it.key===sw.key&&!it.logged.length){const nx=a==='doswap'?t.dataset.ex:ranked(it.pat)[0];const r=rx(nx,it.kind);Object.assign(it,{ex:nx,lo:r.lo,hi:r.hi,rest:r.rest})}}));S.draft=null;store.saveActive()}
    S.swap=null;render();break}
  case'closemodal':S.swap=null;S.confirm=null;S.info=null;render();break;
  case'export':{const blob=new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),profile:S.profile,active:S.active,sessions:S.sessions},null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob),l=document.createElement('a');l.href=url;l.download=`plate-coach-backup-${ymd(new Date())}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);break}
  case'askwipe':S.confirm={title:'Erase all training data?',msg:'This deletes your program, history and any session in progress. It cannot be undone.',yes:'wipe',label:'Erase'};render();break;
  case'wipe':S.confirm=null;await store.wipe();S.profile=null;S.sessions=[];S.active=null;S.form=null;S.tab='settings';render();toast('All data erased');break;
  }
});
document.addEventListener('click',e=>{if(e.target.id==='modal'){S.swap=null;S.confirm=null;S.info=null;render()}});
if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
init();

</script>
</body>
