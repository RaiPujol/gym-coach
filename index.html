<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calisthenics Coach</title>
<meta name="description" content="Bodyweight training coach: a daily sheet of 6 exercises with pictures, progressions and tracking.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calisthenics Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: phone-first single column coach with a fixed bottom tab bar; competition-plate colors code muscle regions (red push, blue pull, yellow legs, green core). */
:root{
  --bg:#EEF0F3;--surface:#FFFFFF;--surface2:#E4E7EC;--ink:#14171C;--muted:#5A6170;--line:#D3D7DE;
  --red:#C3342A;--blue:#2453BF;--yellow:#B98A00;--green:#26804E;--on:#FFFFFF;
  --redsoft:#F7E1DF;--bluesoft:#DFE6F7;--yellowsoft:#F5ECCF;--greensoft:#DCEFE3;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  --fig-accent:#C3342A;--fig-far:#9AA1AD;--prop:#B7BDC7;--figbg:#F4F5F7;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317;--surface:#1A1D23;--surface2:#242831;--ink:#ECEEF2;--muted:#9BA2AE;--line:#2D323B;
  --red:#E85A4E;--blue:#6C96F2;--yellow:#E8BD3F;--green:#4DB87D;--on:#111317;
  --redsoft:#3A1F1D;--bluesoft:#1E2840;--yellowsoft:#3A3118;--greensoft:#1A3326;--fig-accent:#E85A4E;--fig-far:#5D6470;--prop:#4A505B;--figbg:#20242B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317;--surface:#1A1D23;--surface2:#242831;--ink:#ECEEF2;--muted:#9BA2AE;--line:#2D323B;
  --red:#E85A4E;--blue:#6C96F2;--yellow:#E8BD3F;--green:#4DB87D;--on:#111317;
  --redsoft:#3A1F1D;--bluesoft:#1E2840;--yellowsoft:#3A3118;--greensoft:#1A3326;--fig-accent:#E85A4E;--fig-far:#5D6470;--prop:#4A505B;--figbg:#20242B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on);font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 18px}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;border:1px solid transparent}
.m-red{background:var(--redsoft);color:var(--red)}.m-blue{background:var(--bluesoft);color:var(--blue)}
.m-yellow{background:var(--yellowsoft);color:var(--yellow)}.m-green{background:var(--greensoft);color:var(--green)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border-left:3px solid var(--yellow);background:var(--yellowsoft);padding:10px 12px;border-radius:6px;font-size:13px}
.warn{border-left-color:var(--red);background:var(--redsoft)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-height:76px}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase}
.day .dt{font-size:11px;line-height:1.2;color:var(--muted)}
.day.rest{background:transparent;border-style:dashed}
.day.today{border-color:var(--ink);border-width:2px}
.day.done{background:var(--greensoft)}
.day button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tick{color:var(--green);font-weight:700;font-size:13px}
/* blocks */
.block{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.block:first-child{border-top:0;padding-top:0}
.bhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.blabel{font-family:var(--f-display);font-weight:700;font-size:22px;width:24px}
.exrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:start}
.tag{font-family:var(--f-display);font-weight:700;font-size:15px;border-radius:6px;background:var(--surface2);text-align:center;padding:2px 0}
.exname{font-weight:600}
.rx{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* runner */
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--red)}
.current{border:2px solid var(--ink)}
.bigname{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;text-transform:uppercase}
.target{font-family:var(--f-display);font-size:22px;font-weight:600}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface2);font-size:22px;font-weight:600}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700;width:100%;min-width:0;padding:6px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.setchips{display:flex;flex-wrap:wrap;gap:6px}
.setchip{font-family:var(--f-display);font-size:16px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface2);font-variant-numeric:tabular-nums}
.check{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%}
.check:hover{border-color:var(--line)}
.check.on{background:var(--surface2)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.f{background:var(--green);border-color:var(--green)}
.done-name{text-decoration:line-through;color:var(--muted)}
/* volume */
.vol{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:13px}
.track{position:relative;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:var(--greensoft);border-left:1px dashed var(--green);border-right:1px dashed var(--green)}
.fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:2px}
.f-red{background:var(--red)}.f-blue{background:var(--blue)}.f-yellow{background:var(--yellow)}.f-green{background:var(--green)}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{border:0;background:none;padding:12px 2px 10px;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:3px solid transparent}
#tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:var(--f-display);font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);border-width:2px}
.sci{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.sci .k{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--red);line-height:1}
.ref{font-size:12px;color:var(--muted)}
.hist summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;z-index:60;font-size:14px}
.loading{padding:40px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.progress>i{transition:width .3s}}
@media (max-width:420px){h1{font-size:30px}.bigname{font-size:28px}.vol{grid-template-columns:78px minmax(0,1fr) 34px}}

.exlink{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-decoration-thickness:2px}
.exlink:hover{text-decoration-color:var(--red)}
.exlink:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.exlink.exname{font-weight:600}
.chip.outline{border-color:var(--line);color:var(--muted)}
.howto summary{cursor:pointer;font-weight:600;color:var(--blue);font-size:14px}
.howto ol{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.big{font-size:36px;font-weight:700}
.day.sel{outline:2px solid var(--red);outline-offset:1px}
.axis{position:relative;height:14px;font-size:12px}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none;left:0}
textarea,input.plain{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input.plain{font-family:var(--f-display);font-size:24px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.inputs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
a.btn{text-decoration:none;color:var(--ink);text-align:center}
label.btn{cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* exercise pictures */
.fg,.fg-arm{stroke:var(--ink);stroke-linecap:round}
.fg-arm{stroke:var(--fig-accent)}
.fg-far{stroke:var(--fig-far);stroke-linecap:round}
.fg-fill{fill:var(--ink)}
.pr-fill{fill:var(--surface2);stroke:var(--prop);stroke-width:1.5}
.pr-line{stroke:var(--prop);stroke-width:3;stroke-linecap:round}
.pr-wall{stroke:var(--prop);stroke-width:5}
.pr-bar{fill:var(--prop)}
.pr-floor{stroke:var(--prop);stroke-width:2}
.figpair{display:flex;align-items:center;gap:6px;background:var(--figbg);border-radius:8px;padding:8px}
.figbox{margin:0;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.fig{display:block;width:100%;height:auto;max-height:150px}
.figpair.lg .fig{max-height:190px}
.figbox figcaption{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.figarrow{color:var(--muted);font-size:20px;flex:none}
.sheetrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px}
.sheetrow:hover{border-color:var(--muted)}
.thumb{display:block;width:72px;height:56px;background:var(--figbg);border-radius:6px;padding:3px}
.thumb svg,.mini svg,.restthumb svg{width:100%;height:100%;display:block}
.mini{display:block;width:52px;height:40px;background:var(--figbg);border-radius:5px;padding:2px;flex:none}
.restthumb{width:96px;height:72px;flex:none;background:var(--figbg);border-radius:8px;padding:4px}
.sheetrow .rx{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lvl{display:inline-flex;gap:2px;margin-left:2px}
.lvl i{width:6px;height:6px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.lvl i.f{background:var(--red);border-color:var(--red)}
.ladrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px}
.ladrow.cur{border-color:var(--ink);border-width:2px}
.ladname{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.ladname:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.levelup{display:flex;gap:10px;align-items:center}
.block .sheetrow+.sheetrow{margin-top:0}
.exlink.bigname{font-family:var(--f-display);font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05;text-decoration-thickness:2px}
</style>
</head>
<body>
<main id="app"><div class="loading muted">Loading your training…</div></main>
<nav id="tabs" aria-label="Sections"><div class="in">
  <button data-a="tab" data-v="today">Today</button>
  <button data-a="tab" data-v="week">Week</button>
  <button data-a="tab" data-v="history">History</button>
  <button data-a="tab" data-v="science">Science</button>
  <button data-a="tab" data-v="settings">Setup</button>
</div></nav>
<div id="rest" class="overlay" hidden></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Calisthenics library. eq: none (floor/wall), table (low table, about knee height), bar (optional pull-up bar).
   lvl: difficulty 0-5 used for starting level and progression. u:'s' = timed hold. t: k knee, s shoulder, b low back.
   pz: picture poses (S start, F finish, or H hold) with props P. */
const MUS={chest:['Chest','red'],delts:['Shoulders','red'],triceps:['Triceps','red'],back:['Back','blue'],biceps:['Biceps','blue'],
  quads:['Quads','yellow'],hams:['Hamstrings','yellow'],glutes:['Glutes','yellow'],calves:['Calves','yellow'],core:['Core','green']};
const ST={h:[80,71],t:-90,a:[92,92],l:{t:[80,124],s:-1}};
const PU_S={S:[110,88],t:-21,a:{t:[112,124],s:1},l:[159,159],ft:100},PU_F={S:[118,111],t:-6,a:{t:[110,124],s:1},l:[174,174],ft:100};
const HANG={S:[80,31],t:-90,a:{t:[80,-6],s:1},l:[100,128],ft:40},PULL_TOP={S:[76,8],t:-95,a:{t:[80,-6],s:1},l:[100,128],ft:40};
const BRIDGE_S={h:[72,121],t:180,a:[12,0],l:{t:[104,124],s:-1}},BRIDGE_F={h:[76,98],t:150,a:[15,0],l:{t:[104,124],s:-1}};
const HS={S:[90,87],t:96,a:{t:[90,124],s:1},l:[-90,-90],ft:-90};
const SPLIT_F={h:[78,96],t:-90,a:[92,92],l:{t:[100,124],s:-1},l2:{t:[50,118],s:-1},ft2:70};
const EX={
 incline_pu:{n:'Incline Push-up',p:['chest'],s:['triceps','delts'],eq:'table',lvl:1,t:'',
  st:['Put your hands on the edge of the table, slightly wider than your shoulders.','Walk your feet back until your body is one straight line from head to heels.','Lower your chest to the table edge, elbows about 45° from your body.','Push the table away until your arms are straight.'],
  mi:['Hips sagging or piking up','Only moving the head toward the table'],
  pz:{P:{table:[98,46]},S:{S:[108,66],t:-37,a:{t:[103,101],s:1},l:[143,143],ft:100},F:{S:[111,90],t:-22,a:{t:[103,101],s:1},l:[158,158],ft:98}}},
 knee_pu:{n:'Knee Push-up',p:['chest'],s:['triceps','delts'],eq:'none',lvl:1,t:'',
  st:['Kneel on a folded towel, hands on the floor a bit wider than your shoulders.','Lean forward so your body is straight from knees to head.','Lower your chest to a fist-height from the floor.','Press back up to straight arms.'],
  mi:['Bending at the hips instead of keeping a straight line','Elbows flaring straight out to the sides'],
  pz:{S:{S:[110,88],t:-37,a:{t:[112,124],s:1},l:[143,200],ft:200},F:{S:[118,111],t:-13,a:{t:[110,124],s:1},l:[168,205],ft:205}}},
 pushup:{n:'Push-up',p:['chest'],s:['triceps','delts','core'],eq:'none',lvl:2,t:'',
  st:['Hands slightly wider than shoulders, body in one line from head to heels.','Squeeze your glutes and brace your stomach.','Lower until your chest nearly touches the floor, elbows about 45°.','Push the floor away and lock out.'],
  mi:['Hips sagging','Half reps that stop well above the floor','Head dropping toward the floor'],
  pz:{S:PU_S,F:PU_F}},
 diamond_pu:{n:'Diamond Push-up',p:['triceps'],s:['chest','delts'],eq:'none',lvl:3,t:'',
  st:['Hands together under your chest, thumbs and index fingers forming a diamond.','Body straight, glutes tight.','Lower your chest to your hands, elbows brushing your ribs.','Press up to straight arms.'],
  mi:['Elbows flaring wide','Hips sagging when the reps get hard'],
  pz:{S:PU_S,F:PU_F}},
 decline_pu:{n:'Decline Push-up',p:['chest'],s:['delts','triceps'],eq:'table',lvl:3,t:'',
  st:['Put your feet on the table and hands on the floor under your shoulders.','Keep your body in one straight line.','Lower your chest (not your head) to the floor.','Press back up.'],
  mi:['Piking the hips up to make it easier','Neck reaching for the floor'],
  pz:{P:{table:[6,44]},S:{S:[118,88],t:-2,a:{t:[120,124],s:1},l:[178,178],ft:100},F:{S:[124,111],t:12,a:{t:[116,124],s:1},l:[192,192],ft:100}}},
 pp_pu:{n:'Pseudo Planche Push-up',p:['chest'],s:['delts','triceps','core'],eq:'none',lvl:4,t:'s',
  st:['Push-up position with hands turned out or back, placed by your lower ribs.','Lean your shoulders forward past your hands.','Keep the lean as you lower your chest to the floor.','Press up without losing the forward lean.'],

/* ---------- Exercise selection and levels ---------- */
const eqOk=id=>EX[id].eq!=='bar'||S.profile.equip==='bar';
const limHit=id=>(S.profile.limits||[]).some(l=>EX[id].t.includes(l));

const startLvl=()=>({beg:1,int:2,adv:3}[S.profile.level]||2)+(S.profile.goal==='strength'?1:0);

function rx(id){
  const e=EX[id],P=S.profile,G=P.goal,hold=isHold(id),easyLeg=!hold&&e.lvl<=1&&LEGM.includes(e.p[0]);
  const R=hold?{muscle:[20,45],strength:[10,25],fat:[20,40],gen:[20,40]}[G]:easyLeg?(G==='strength'?[10,15]:[12,20]):{muscle:[8,15],strength:[4,8],fat:[10,20],gen:[8,15]}[G];

function pairInfo(a,b){
  const x=EX[a].p[0],y=EX[b].p[0];
  if(ANT.some(([m,n])=>(m===x&&n===y)||(m===y&&n===x)))
    return{type:'Antagonist pair',why:`${MUS[x][0]} and ${MUS[y][0]} do opposite jobs, so one rests while the other works. Same quality, about a third less time.`};
  const lx=LEGM.includes(x),ly=LEGM.includes(y);

/* ---------- Plan ---------- */
function splitFor(n,w){

  return{2:['FB_A','FB_B'],4:['UPPER','LOWER','UPPER','LOWER'],5:['UPPER','LOWER','SKILL','UPPER','LOWER'],6:['UPPER','LOWER','SKILL','UPPER','LOWER','SKILL']}[n];

function weekPlan(w){

}
const dayName=p=>TPL[p.tpl].n;
const isDeload=w=>S.profile.deload&&((w%5)+5)%5===4;
function buildSession(w,slot){
  const p=weekPlan(w).find(x=>x&&x.slot===slot),dl=isDeload(w),used=new Set(),fat=S.profile.goal==='fat';
  const pick=pat=>{let id=curEx(pat);if(used.has(id)){const a=avail(pat),i=a.indexOf(id);id=[...a.slice(0,i).reverse(),...a.slice(i+1)].find(x=>!used.has(x))||id}used.add(id);return id};
  const mk=pat=>{const ex=pick(pat),r=rx(ex);return{pat,ex,...r,sets:dl?Math.max(1,Math.ceil(r.sets/2)):r.sets,rir:dl?Math.max(3,r.rir):r.rir,logged:[],skipped:false}};
  let blocks;
  if(fat){const items=TPL[p.tpl].g.flat().map(mk);blocks=[{label:'A',kind:'circuit',items,type:`Circuit · ${items[0].sets} rounds`}]}
  else blocks=TPL[p.tpl].g.map((grp,gi)=>{const items=grp.map(mk);return{label:'ABC'[gi],kind:'pair',items,type:pairInfo(items[0].ex,items[1].ex).type}});
  return{id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,slot,tpl:p.tpl,day:p.day,name:dayName(p),deload:dl,blocks,startedAt:null};

const workSec=it=>isHold(it.ex)?it.hi:40;

  let t=360;sess.blocks.forEach(b=>{const n=Math.max(...b.items.map(x=>x.sets));
    if(b.kind==='circuit')t+=n*(b.items.reduce((s,it)=>s+workSec(it)+15,0)+b.items[0].rest);
    else{const r=Math.max(...b.items.map(x=>x.rest));t+=n*(workSec(b.items[0])+workSec(b.items[1])+45+r*.8)}});

/* ---------- Progression ---------- */
const fmtN=n=>Number.isInteger(+n)?String(+n):(+n).toFixed(1);
const unitOf=id=>isHold(id)?'s':' reps';
const fmtSet=(id,s)=>`${isHold(id)?s.r+'s':s.r}${s.w>0?' +'+fmtN(s.w):''}`;
const strength=(id,s)=>isHold(id)?s.r:s.r*(1+(s.w||0)/40);

function suggest(id,lo,hi,deload,pat){

  if(!lp)return{w:0,r:hold?lo:Math.round((lo+hi)/2),note:hold?`Hold for ${lo}–${hi} s with good form. Stop when the shape breaks.`:`First time: aim for ${lo}–${hi} clean reps. If you can't reach ${lo}, switch to an easier step with "Details & level".`};
  const sets=lp.sets,w=Math.max(...sets.map(s=>s.w||0)),minR=Math.min(...sets.map(s=>s.r));
  let r,note;

  else if(minR<lo){r=lo;note=`Below ${lo}${u} last time: aim for ${lo} on every set before moving on.`}
  else{r=Math.min(hi,minR+(hold?5:1));note=`Beat last time: aim for ${r}${u} on every set. At ${hi} on all sets you level up${nxt?' to '+EX[nxt].n:''}.`}

function applyProgress(items,deload){
  const ups=[];if(deload)return ups;
  items.forEach(it=>{if(!it.pat||!it.logged.length||it.skipped)return;
    const rs=it.logged.map(s=>s.r),short=isHold(it.ex)?it.lo-10:it.lo-2;
    if(it.logged.length>=it.sets&&Math.min(...rs)>=it.hi){const n=stepEx(it.pat,it.ex,1);if(n){S.profile.prog[it.pat]=n;ups.push({pat:it.pat,from:it.ex,to:n,dir:1});return}}
    else if(Math.max(...rs)<short){const p=stepEx(it.pat,it.ex,-1);if(p){S.profile.prog[it.pat]=p;ups.push({pat:it.pat,from:it.ex,to:p,dir:-1});return}}
    S.profile.prog[it.pat]=it.ex;});

}

    EX[it.ex].p.forEach(m=>v[m]+=it.sets);(EX[it.ex].s||[]).forEach(m=>v[m]+=it.sets/2);}))});
  return v;
}

  return out;

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i===2?1046:784;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch{}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}}

/* ---------- Session runner ---------- */
function steps(a){const out=[];a.blocks.forEach((b,bi)=>{const m=Math.max(...b.items.map(x=>x.sets));for(let k=0;k<m;k++)b.items.forEach((it,ii)=>{if(k<it.sets)out.push({bi,ii,k})})});return out}
const pending=(a,s)=>{const it=a.blocks[s.bi].items[s.ii];return!it.skipped&&it.logged.length<=s.k};
function current(a){const st=steps(a);if(S.focus){const f=st.find(s=>s.bi===S.focus.bi&&s.ii===S.focus.ii&&pending(a,s));if(f)return f;S.focus=null}return st.find(s=>pending(a,s))||null}
function restAfter(a,s){
  const b=a.blocks[s.bi],later=b.items.slice(s.ii+1).some(p=>!p.skipped&&p.logged.length<=s.k&&s.k<p.sets);
  if(later)return b.kind==='circuit'?15:45;

function ensureDraft(a,c){

function startRest(sec,next){S.rest={until:Date.now()+sec*1000,total:sec,next};renderRest()}
let restTimer=null;
function renderRest(){

  const a=S.active,n=S.rest.next,it=a.blocks[n.bi].items[n.ii];
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="Rest timer">
    <p class="eyebrow">Rest</p>
    <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--surface2)" stroke-width="7"/><circle id="ringarc" cx="50" cy="50" r="45" fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"/></svg>

    <div class="row"><button class="btn" data-a="restadd" style="flex:1">+30 s</button><button class="btn primary" data-a="restskip" style="flex:2">Start set</button></div></div>`;
  el.hidden=false;let beeped=Date.now()>S.rest.until;
  const tick=()=>{if(!S.rest)return;const left=Math.max(0,(S.rest.until-Date.now())/1000),num=$('#restnum'),arc=$('#ringarc');if(!num)return;
    const s=Math.ceil(left);num.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');arc.setAttribute('stroke-dashoffset',String(282.7*(1-left/S.rest.total)));
    if(left<=0){$('#restmsg').textContent='Time. Go.';if(!beeped){beeped=true;beep()}}};
  clearInterval(restTimer);restTimer=setInterval(tick,250);tick();
}
function logSet(){
  const a=S.active,c=current(a);if(!c)return;const it=a.blocks[c.bi].items[c.ii],d=S.draft;
  const w=parseFloat(d.w)||0,r=parseInt(d.r,10);
  if(!(r>0)){toast(isHold(it.ex)?'Enter the seconds you held':'Enter the reps you did');return}
  it.logged.push({w,r,rir:d.rir,t:Date.now()});S.draft=null;store.saveActive();
  const nx=current(a);render();if(nx)startRest(restAfter(a,c),nx);else toast('All sets done. Finish to save.');
}
function prsFor(entries){
  const prs=[];entries.forEach(e=>{const best=Math.max(...e.sets.map(s=>strength(e.ex,s)));let prev=0;
    S.sessions.forEach(s=>s.entries.forEach(x=>{if(x.ex===e.ex)x.sets.forEach(st=>{prev=Math.max(prev,strength(e.ex,st))})}));
    if(prev>0&&best>prev+.01)prs.push({ex:e.ex,best:Math.max(...e.sets.map(s=>s.r))})});return prs;
}
function finishSession(){

  S.rest=null;renderRest();
  if(!entries.length){S.active=null;store.saveActive();S.confirm=null;render();toast('Session discarded (nothing logged).');return}
  const prs=prsFor(entries),ups=applyProgress(items,a.deload);
  const sess={id:a.id,date:a.startedAt,end:Date.now(),w:a.w,slot:a.slot,tpl:a.tpl,name:a.name,deload:a.deload,entries};
  S.sessions.unshift(sess);S.active=null;S.focus=null;S.draft=null;S.confirm=null;
  store.saveSession(sess);store.saveActive();store.saveProfile();S.summary={...sess,prs,ups};
  try{lock&&lock.release()}catch{}lock=null;render();window.scrollTo(0,0);
}
function quickLog(ex,w,r,n){

  ${s.ups.length?`<section class="card"><h3>Level changes</h3>${s.ups.map(u=>`<div class="levelup"><span class="mini">${figThumb(u.to)}</span><div class="stack" style="gap:2px"><span class="eyebrow">${u.dir>0?'Level up':'Step back'} · ${PATN[u.pat]}</span><span>${esc(EX[u.from].n)} → <b>${esc(EX[u.to].n)}</b></span></div></div>`).join('')}
    <p class="muted small">${s.ups.some(u=>u.dir>0)?'You hit the top of the range on every set, so next time you train the harder version. ':''}${s.ups.some(u=>u.dir<0)?'Reps fell well short, so the easier version builds you back up.':''}</p></section>`:''}
  ${s.prs.length?`<section class="card"><h3>New bests</h3>${s.prs.map(p=>`<div class="row between"><span>${esc(EX[p.ex].n)}</span><span class="num" style="font-size:18px">${p.best}${unitOf(p.ex)}</span></div>`).join('')}</section>`:''}
  <section class="card"><p class="eyebrow">Up next</p><h3>${dayName(np)} · ${nx.nextWeek?'next ':''}${DAYL[np.day]}</h3><p class="muted small">Recovery: sleep 7–9 h and eat roughly 1.6 g of protein per kg of bodyweight a day.</p></section>
  <button class="btn primary wide" data-a="closesummary">Back to plan</button>`;
}
function viewWeek(){
  const w=curWeek(),plan=weekPlan(w),vol=weekVolume(w),warn=recoveryWarnings(w),max=24,n=S.profile.days.length,P=S.profile;
  const pats=[...new Set(plan.filter(Boolean).flatMap(p=>TPL[p.tpl].g.flat()))];
  return`<header class="stack"><p class="eyebrow">Week ${w+1}${isDeload(w)?' · Easy week':''} · ${GOALS[P.goal][0]}${P.focus.length?' · Focus: '+P.focus.map(f=>FOCUS[f].n).join(', '):''}</p><h1>Weekly schedule</h1><p class="muted">${SPLITS[n]}</p></header>
  ${warn.map(x=>`<p class="notice warn">${esc(x)}</p>`).join('')}
  ${plan.map((p,d)=>p?(()=>{const s=buildSession(w,p.slot);return`<details class="card hist"><summary><div class="stack" style="gap:2px"><span class="eyebrow">${DAYL[d]}${doneSlots(w).has(p.slot)?' · ✓ done':''}</span><h3>${dayName(p)}</h3></div><span class="num muted">~${estMinutes(s)} min</span></summary>${viewSheet(s)}</details>`})():'').join('')}
  <section class="card"><div class="stack" style="gap:4px"><h3>Your levels</h3><p class="muted small">Where you are on each progression ladder. Tap one to see the pictures or change level.</p></div>
  ${pats.map(pat=>{const id=curEx(pat),a=avail(pat),i=a.indexOf(id),nx=a[i+1];return`<button class="sheetrow" data-a="info" data-ex="${id}" data-pat="${pat}"><span class="thumb">${figThumb(id)}</span><span class="stack" style="gap:2px;min-width:0"><span class="eyebrow">${PATN[pat]} · step ${i+1} of ${a.length}</span><span class="exname">${esc(EX[id].n)}</span><span class="muted small">${nx?'Next: '+esc(EX[nx].n):'Top of the ladder'}</span></span><span></span></button>`}).join('')}</section>
  <section class="card"><div class="stack" style="gap:4px"><h3>Weekly sets per muscle</h3><p class="muted small">Direct sets count 1, indirect sets 0.5. The green band is the 10–20 hard sets per week linked to most growth.</p></div>
  ${Object.keys(MUS).map(m=>`<div class="vol"><span>${MUS[m][0]}${P.focus.some(f=>FOCUS[f].m.includes(m))?' ★':''}</span><div class="track"><div class="band" style="left:${10/max*100}%;width:${10/max*100}%"></div><div class="fill f-${MUS[m][1]}" style="width:${Math.min(100,vol[m]/max*100)}%"></div></div><span class="num" style="font-size:16px;text-align:right">${fmtN(Math.round(vol[m]*2)/2)}</span></div>`).join('')}
  <div class="vol"><span></span><div class="axis muted num"><span>0</span><span style="left:${10/max*100}%">10</span><span style="left:${20/max*100}%">20</span></div><span></span></div>
  <p class="muted small">Below the band is fine for small muscles that get indirect work, and for beginners. To add volume, train more days or add a focus area in Setup.</p></section>`;
}
function spark(pts){
  if(pts.length<2)return'';const W=110,H=34,mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
  const xy=pts.map((v,i)=>[4+i*(W-8)/(pts.length-1),H-4-(v-mn)/rg*(H-8)]);
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${xy.map(p=>p.join(',')).join(' ')}"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="3" fill="var(--blue)"/></svg>`;
}
function exHistory(id){const out=[];[...S.sessions].reverse().forEach(s=>s.entries.forEach(e=>{if(e.ex===id&&e.sets.length)out.push({date:s.date,best:Math.max(...e.sets.map(x=>x.r)),sets:e.sets})}));return out}
function viewHistory(){
  if(!S.sessions.length)return`<header class="stack"><h1>History</h1></header><section class="card"><p class="muted">No sessions yet. Finish a session, or tap any exercise and log what you did, and it appears here. The coach reads this history to set your next targets and level-ups.</p></section>`;
  const exs=[...new Set(S.sessions.flatMap(s=>s.entries.map(e=>e.ex)))];
  return`<header class="stack"><h1>History</h1><p class="muted">${planned().length} sessions logged · ${planned().filter(s=>s.w===curWeek()).length} this week</p></header>
  <section class="card"><h3>Progress by exercise</h3><p class="muted small">Best set per session (reps, or seconds for holds). Tap one for pictures and details.</p>
  ${exs.map(id=>{const h=exHistory(id),pts=h.map(x=>x.best);return`<div class="row between" style="flex-wrap:nowrap"><div class="stack" style="gap:0;min-width:0">${exBtn(id)}<span class="muted small">${h.length} session${h.length>1?'s':''}</span></div><div class="row" style="flex-wrap:nowrap">${spark(pts.slice(-12))}<span class="num" style="font-size:18px;min-width:44px;text-align:right">${pts[pts.length-1]}${isHold(id)?'s':''}</span></div></div>`}).join('')}</section>
  ${S.sessions.slice(0,80).map(s=>`<details class="card hist"><summary><div class="stack" style="gap:2px"><span class="eyebrow">${fmtDate(s.date)}${s.deload?' · Easy week':''}</span><h3>${esc(s.name)}</h3></div><span class="num muted">${s.entries.reduce((n,e)=>n+e.sets.length,0)} sets</span></summary>
    ${s.entries.map(e=>`<div class="stack" style="gap:4px">${exBtn(e.ex)}<div class="setchips">${e.sets.map(x=>`<span class="setchip">${fmtSet(e.ex,x)}</span>`).join('')}</div></div>`).join('')}</details>`).join('')}`;
}
function viewScience(){
  const P=[
   ['=','Bodyweight builds muscle like weights','Push-ups produced similar strength gains to the bench press at matched effort, and similar muscle growth in a separate trial. What matters is how hard the set is, not where the load comes from.','Calatayud et al., 2015, J Strength Cond Res; Kikuchi & Nakazato, 2017, J Exerc Sci Fit'],
   ['6–30','Go close to failure','Light and heavy loads grow muscle similarly when sets end near failure. That is why every set here has a rep range and a "reps left in the tank" target.','Schoenfeld et al., 2017, J Strength Cond Res; Refalo et al., 2023, Sports Medicine'],
   ['↑','Harder variations are your extra weight','Changing leverage (incline, then floor, then decline push-up) raises the load like adding plates. Hit the top of the rep range on every set and the coach moves you up a step: the same double-progression logic used with weights.','Plotkin et al., 2022, PeerJ'],
   ['↔','Pair opposing muscles','Alternating push and pull, or front and back of the legs, keeps quality high while cutting session time. Each day is three such pairs.','Robbins et al., 2010, J Strength Cond Res; Weakley et al., 2017, Eur J Appl Physiol'],
   ['2×','Train each muscle twice a week','With weekly volume matched, two or more sessions per muscle per week beat one. Every split here gives each muscle at least two.','Schoenfeld, Ogborn & Krieger, 2016, Sports Medicine'],
   ['10–20','Hard sets per muscle per week','More weekly sets mean more growth, with diminishing returns at the top. The Week tab charts your sets against this range.','Schoenfeld, Ogborn & Krieger, 2017, J Sports Sciences'],
   ['⟳','Circuits for fat loss','Moving between exercises with short rests keeps your heart rate up, so the same session uses more energy, while the strength work protects muscle in a calorie deficit.','Muñoz-Martínez et al., 2017, J Sports Med Phys Fitness (review of circuit training)'],
   ['48 h','Space sessions for the same muscle','Muscle protein synthesis stays raised for a day or two after training. The Week tab flags back-to-back days that hit the same muscle.','MacDougall et al., 1995, Can J Appl Physiol'],
   ['W5','Easy week every 5th week','Coaches commonly cut volume every 4–6 weeks to shed fatigue. This rests on practitioner consensus more than trials, so you can turn it off.','Bell et al., 2023, Sports Medicine – Open (Delphi consensus)']];
  return`<header class="stack"><h1>The science inside</h1><p class="muted">Each rule the coach follows, and where it comes from.</p></header>
  ${P.map(([k,t,b,r])=>`<section class="card sci"><span class="k">${k}</span><div class="stack" style="gap:6px"><h3>${t}</h3><p>${b}</p><p class="ref">${r}</p></div></section>`).join('')}
  <p class="muted small">Not medical advice. Stop any exercise that causes sharp pain and check with a clinician.</p>`;
}
function viewInfo(){
  const id=S.info.ex,e=EX[id],h=exHistory(id),u=S.profile.units,hold=isHold(id);
  const pat=S.info.pat&&LADDER[S.info.pat]&&LADDER[S.info.pat].includes(id)?S.info.pat:patsOf(id)[0];
  const lad=pat?avail(pat):[],cur=pat?curEx(pat):null;
  const inRun=S.active&&S.active.startedAt&&S.active.blocks.some(b=>b.items.some(it=>it.ex===id));
  const q=S.info.q||(S.info.q={w:0,r:hold?30:10,n:1});
  const vid='https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+' calisthenics tutorial');
  return`<div class="sheet" role="dialog" aria-label="${esc(e.n)}">
  <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div class="stack" style="gap:6px"><p class="eyebrow">${EQN[e.eq]}${e.eq==='none'?'':' needed'}${hold?' · Timed hold':''}</p><h2>${esc(e.n)}</h2></div><button class="btn sm" data-a="closemodal" aria-label="Close">Close</button></div>
  ${figPair(id,'lg')}
  <div class="row" style="gap:4px">${e.p.map(chipM).join('')}${(e.s||[]).map(m=>`<span class="chip outline">${MUS[m][0]}</span>`).join('')}${lvlDots(id)}</div>
  <div class="stack"><h3>How to do it</h3><ol class="steps">${e.st.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
  <div class="stack"><h3>Avoid</h3><ul class="steps">${e.mi.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <a class="btn" href="${vid}" target="_blank" rel="noopener">Watch a demo on YouTube ↗</a>
  ${pat&&lad.length>1?`<div class="stack"><h3>Level: ${PATN[pat]} ladder</h3><p class="muted small">Easiest first. You move down this list automatically when you hit the top of the range on every set.</p>
    ${lad.map((x,i)=>`<div class="ladrow ${x===cur?'cur':''}"><button class="ladname" data-a="info" data-ex="${x}" data-pat="${pat}"><span class="mini">${figThumb(x)}</span><span class="stack" style="gap:0;min-width:0"><span class="num muted small">Step ${i+1}${x===id?' · viewing':''}</span><span>${esc(EX[x].n)}</span></span></button>${x===cur?'<span class="tick">Your level</span>':`<button class="btn sm" data-a="setlevel" data-ex="${x}" data-pat="${pat}">Train this</button>`}</div>`).join('')}</div>`:''}
  <div class="stack"><h3>Your numbers</h3>${h.length?`<div class="row between" style="flex-wrap:nowrap"><span class="muted small">Best set: <b class="num" style="font-size:18px;color:var(--ink)">${Math.max(...h.map(x=>x.best))}${unitOf(id)}</b></span>${spark(h.map(x=>x.best).slice(-12))}</div>
    ${h.slice(-5).reverse().map(x=>`<div class="row between"><span class="muted small">${fmtDate(x.date)}</span><span class="setchips">${x.sets.map(s=>`<span class="setchip">${fmtSet(id,s)}</span>`).join('')}</span></div>`).join('')}`:'<p class="muted small">Nothing logged yet.</p>'}</div>
  ${inRun?'<p class="notice">This exercise is in your session. Log it from the session card so it counts toward the workout.</p>':`<div class="stack"><h3>Log it</h3><p class="muted small">Track what you did, in or outside a planned session. It feeds your next suggestion.</p>
    <div class="inputs three"><div class="field"><label for="q-r">${hold?'Seconds':'Reps'}</label><input class="plain" id="q-r" inputmode="numeric" value="${esc(q.r)}"></div>
    <div class="field"><label for="q-n">Sets</label><input class="plain" id="q-n" inputmode="numeric" value="${esc(q.n)}"></div>
    <div class="field"><label for="q-w">+ ${u}</label><input class="plain" id="q-w" inputmode="decimal" value="${esc(q.w)}" placeholder="0"></div></div>
    <button class="btn primary wide" data-a="quicklog">Save to log</button></div>`}
  <div class="stack"><h3>Your note</h3><textarea id="ex-note" rows="2" placeholder="Hand position, cues that work for you">${esc(S.profile.notes[id]||'')}</textarea><button class="btn sm" data-a="savenote" style="align-self:flex-start">Save note</button></div>
  </div>`;
}
function viewModal(){
  const m=$('#modal');
  if(S.info){m.innerHTML=viewInfo();m.hidden=false;return}
  if(S.confirm){m.innerHTML=`<div class="sheet" role="dialog"><h3>${esc(S.confirm.title)}</h3><p class="muted">${esc(S.confirm.msg)}</p><div class="row"><button class="btn" data-a="closemodal" style="flex:1">Cancel</button><button class="btn primary" data-a="${S.confirm.yes}" style="flex:1">${esc(S.confirm.label)}</button></div></div>`;m.hidden=false;return}
  m.hidden=true;m.innerHTML='';
}
function render(){
  const app=$('#app');
  if(S.mode==='loading'){app.innerHTML='<div class="loading muted">Loading your training…</div>';return}
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.tab?'page':'false'));
  $('#tabs').hidden=!S.profile;
  app.innerHTML=!S.profile?viewSetup(true):{today:viewToday,week:viewWeek,history:viewHistory,science:viewScience,settings:()=>viewSetup(false)}[S.tab]();
  viewModal();
}

/* ---------- Events ---------- */
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(S.draft){if(id==='in-w')S.draft.w=e.target.value;if(id==='in-r')S.draft.r=e.target.value}
  if(S.info&&S.info.q){if(id==='q-w')S.info.q.w=e.target.value;if(id==='q-r')S.info.q.r=e.target.value;if(id==='q-n')S.info.q.n=e.target.value}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='importfile'||!e.target.files[0])return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.profile||!Array.isArray(d.sessions))throw 0;applyData(d);store.saveLocal();S.form=null;S.tab='today';render();toast(`Restored ${S.sessions.length} sessions`)}catch{toast('That file is not a Calisthenics Coach backup')}};
  r.readAsText(e.target.files[0]);
});
document.addEventListener('click',async e=>{
  if(e.target.id==='modal'){S.confirm=null;S.info=null;render();return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
  switch(a){
  case'tab':S.tab=v;S.form=null;if(v!=='today')S.summary=null;render();window.scrollTo(0,0);break;
  case'form':S.form[t.dataset.k]=v;render();break;
  case'formmulti':{const k=t.dataset.k,arr=S.form[k];if(arr.includes(v))S.form[k]=arr.filter(x=>x!==v);else{if(k==='focus'&&arr.length>=2){toast('Pick up to 2 focus areas');break}S.form[k]=[...arr,v]}render();break}
  case'formtoggle':S.form[t.dataset.k]=!S.form[t.dataset.k];render();break;
  case'formday':{const d=+v,f=S.form;f.days=f.days.includes(d)?f.days.filter(x=>x!==d):[...f.days,d].sort((x,y)=>x-y);render();break}
  case'savesetup':{const f=S.form;if(f.days.length<2||f.days.length>6)return;const first=!S.profile,old=S.profile;
    const reset=old&&(old.level!==f.level||(old.goal==='strength')!==(f.goal==='strength'));
    S.profile={...f,prog:reset?{}:((old&&old.prog)||{}),notes:(old&&old.notes)||{},startDate:(old&&old.startDate)||ymd(mondayOf(new Date()))};
    store.saveProfile();S.form=null;S.pick=null;S.tab='today';render();window.scrollTo(0,0);toast(first?'Plan built. Here is your first sheet.':reset?'Saved. Levels reset to match your experience.':'Saved.');break}
  case'pick':S.pick={w:+t.dataset.w,slot:+t.dataset.slot};render();break;
  case'start':{const nx=nextPlanned(),p=S.pick||{w:nx.w,slot:nx.slot};S.active=buildSession(p.w,p.slot);S.active.startedAt=Date.now();S.pick=null;S.focus=null;S.draft=null;
    store.saveActive();keepAwake();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch{}render();window.scrollTo(0,0);break}
  case'bump':{const c=current(S.active),it=S.active.blocks[c.bi].items[c.ii],d=S.draft,dir=+t.dataset.d;
    if(t.dataset.f==='w'){const cur=parseFloat(d.w)||0,st=S.profile.units==='kg'?2.5:5;d.w=fmtN(Math.max(0,cur+dir*st))}else d.r=Math.max(0,(parseInt(d.r,10)||0)+dir*(isHold(it.ex)?5:1));render();break}
  case'rir':S.draft.rir=+v;render();break;
  case'log':logSet();break;
  case'undo':{let last=null;S.active.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>it.logged.forEach(s=>{if(!last||(s.t||0)>=(last.s.t||0))last={s,bi,ii}})));
    if(!last){toast('No sets logged yet');break}S.active.blocks[last.bi].items[last.ii].logged.pop();S.focus={bi:last.bi,ii:last.ii};S.draft=null;S.rest=null;renderRest();store.saveActive();render();toast('Last set removed');break}
  case'skipex':{const c=current(S.active);S.active.blocks[c.bi].items[c.ii].skipped=true;S.focus=null;S.draft=null;store.saveActive();render();break}
  case'focus':{S.focus={bi:+t.dataset.bi,ii:+t.dataset.ii};const it=S.active.blocks[S.focus.bi].items[S.focus.ii];if(it.skipped)it.skipped=false;S.draft=null;S.rest=null;renderRest();render();window.scrollTo(0,0);break}
  case'restadd':S.rest.until+=30000;S.rest.total+=30;break;
  case'restskip':S.rest=null;renderRest();break;
  case'askfinish':{const left=steps(S.active).filter(s=>pending(S.active,s)).length;if(!left){finishSession();break}
    S.confirm={title:'Finish early?',msg:`${left} set${left>1?'s are':' is'} not logged. Logged sets are saved; the rest are dropped.`,yes:'finish',label:'Finish'};render();break}
  case'finish':finishSession();break;
  case'askdiscard':S.confirm={title:'Discard this session?',msg:'Nothing from this session will be saved.',yes:'discard',label:'Discard'};render();break;
  case'discard':S.active=null;S.confirm=null;S.rest=null;renderRest();store.saveActive();render();break;
  case'closesummary':S.summary=null;render();window.scrollTo(0,0);break;
  case'info':S.info={ex:t.dataset.ex,pat:t.dataset.pat||(S.info&&S.info.pat)||''};render();$('#modal').scrollTop=0;break;
  case'setlevel':setLevel(t.dataset.pat,t.dataset.ex);render();toast(`Now training ${EX[t.dataset.ex].n}`);break;
  case'quicklog':{const q=S.info.q,id=S.info.ex,w=parseFloat(q.w)||0,r=parseInt(q.r,10),n=Math.min(10,Math.max(1,parseInt(q.n,10)||1));
    if(!(r>0)){toast(isHold(id)?'Enter seconds':'Enter reps');break}
    const prs=quickLog(id,w,r,n);S.info.q=null;render();toast(prs.length?'Logged. New best!':`Logged ${n} set${n>1?'s':''}`);break}
  case'savenote':{const val=$('#ex-note').value.trim();if(val)S.profile.notes[S.info.ex]=val;else delete S.profile.notes[S.info.ex];store.saveProfile();toast('Note saved');break}
  case'closemodal':S.confirm=null;S.info=null;render();break;
  case'export':{const blob=new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),profile:S.profile,active:S.active,sessions:S.sessions},null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob),l=document.createElement('a');l.href=url;l.download=`calisthenics-backup-${ymd(new Date())}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);break}
  case'askwipe':S.confirm={title:'Erase all training data?',msg:'This deletes your plan, levels, history and any session in progress. It cannot be undone.',yes:'wipe',label:'Erase'};render();break;
  case'wipe':S.confirm=null;await store.wipe();S.profile=null;S.sessions=[];S.active=null;S.form=null;S.tab='settings';render();toast('All data erased');break;
  }
});
if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
init();
